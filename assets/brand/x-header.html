<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Near Packs X header</title>
<!-- Source for x-header.png (1500x500). Render with: npm run build:x-header -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@700&family=Space+Grotesk:wght@600;700&display=swap">
<link rel="stylesheet" href="../../css/style.css">
<style>
  html, body { margin: 0; background: #070a1c; }
  .hdr { position: relative; width: 1500px; height: 500px; overflow: hidden;
    background:
      radial-gradient(520px 300px at 50% 46%, rgba(0, 236, 151, 0.22), transparent 70%),
      radial-gradient(700px 420px at 50% 40%, rgba(139, 123, 255, 0.30), transparent 70%),
      linear-gradient(180deg, #111418, #070809);
  }
  .rays { position: absolute; inset: -40%; background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(255, 255, 255, 0.05) 0 4deg, transparent 4deg 12deg); }
  .dots { position: absolute; inset: 0; background: radial-gradient(rgba(255, 255, 255, 0.10) 1px, transparent 1.3px) 0 0 / 22px 22px; -webkit-mask-image: radial-gradient(ellipse at 50% 50%, transparent 25%, #000 80%); mask-image: radial-gradient(ellipse at 50% 50%, transparent 25%, #000 80%); }
  .floor { position: absolute; left: 0; right: 0; bottom: 0; height: 120px; background: linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.5)); }
  .pack { position: absolute; width: 168px; }
  .pack .booster { filter: drop-shadow(0 22px 26px rgba(0, 0, 0, 0.6)); }
  .p1 { left: 46px; top: 52px; transform: rotate(-11deg); }
  .p2 { left: 236px; top: 30px; transform: rotate(-3deg); z-index: 2; }
  .p3 { right: 236px; top: 30px; transform: rotate(3deg); z-index: 2; }
  .p4 { right: 46px; top: 52px; transform: rotate(11deg); }
  .center { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -54%); display: grid; justify-items: center; gap: 14px; z-index: 3; width: 760px; text-align: center; }
  .center img { width: 560px; filter: drop-shadow(0 14px 22px rgba(0, 0, 0, 0.55)); }
    .tag { white-space: nowrap; }
  .tag { font: 800 20px/1.2 Inter, sans-serif; color: #eef0ff; letter-spacing: 0.01em; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6); }
  .chips { display: flex; gap: 10px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px; background: rgba(10, 14, 40, 0.75); border: 1px solid rgba(255, 255, 255, 0.18); font: 800 15px/1 Inter, sans-serif; color: #fff; }
  .chip b { color: #00ec97; font-family: 'JetBrains Mono', monospace; }
  .chip .chain-dot { width: 16px; height: 16px; margin: 0; }
  .np-word { display: flex; align-items: center; gap: 0.32em; font: 700 1em/1 'Space Grotesk', sans-serif; letter-spacing: -0.035em; color: #fff; }
  .np-word img { width: 1.15em; height: 1.15em; border-radius: 0.26em; filter: drop-shadow(0 0.08em 0.25em rgba(0, 236, 151, 0.45)); }
  .np-word b { color: #00ec97; font-weight: 700; margin-left: 0.18em; }
</style>
</head>
<body>
<div class="hdr" id="hdr">
  <div class="rays"></div><div class="dots"></div><div class="floor"></div>
  <div class="pack p1" data-pack="starter"></div>
  <div class="pack p2" data-pack="rare"></div>
  <div class="pack p3" data-pack="elite"></div>
  <div class="pack p4" data-pack="legend"></div>
  <div class="center">
    <div style="font-size:84px"><div class="np-word"><img src="nearpacks-icon.svg" alt=""><span>Near<b>Packs</b></span></div></div>
    <div class="tag">Real Pokémon packs · On-chain odds · 96% buyback</div>
    <div class="chips">
      <span class="chip">Packs from <b>$10</b></span>
      <span class="chip">Paid in <b>NEAR</b></span>
            <span class="chip"><span class="chain-dot near"></span>NEAR</span>
      <span class="chip">On-chain RNG</span>
      <span class="chip"><b>@pokenearfun</b></span>
    </div>
  </div>
</div>
<script src="../../js/cards.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/sha256.js"></script>
<script src="../../js/data.js"></script>
<script src="../../js/engine.js"></script>
<script src="../../js/store.js"></script>
<script src="../../js/wallets.js"></script>
<script src="../../js/app.js"></script>
<script>
  // Pack art paths in app.js are relative to the site root.
  document.querySelectorAll('[data-pack]').forEach(function (el) {
    el.innerHTML = PN.ui.packArtHTML(PN.data.packById[el.getAttribute('data-pack')]).replace(/src="assets\//g, 'src="../../assets/');
  });
  document.body.setAttribute('data-ready', '1');
</script>
</body>
</html>
