<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Near Packs X header</title>
<!-- Source for x-header.png (1500x500). Render with: npm run build:x-header
     The bottom-left corner stays quiet: X puts the profile picture there. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=JetBrains+Mono:wght@700&family=Space+Grotesk:wght@600;700&display=swap">
<link rel="stylesheet" href="../../css/style.css">
<style>
  html, body { margin: 0; background: #0a1216; }
  .hdr { position: relative; width: 1500px; height: 500px; overflow: hidden; background: #0a1216; }
  /* tilted wall of real cards on the right, fading into the dark */
  .wall { position: absolute; right: -170px; top: -230px; width: 1250px; height: 1000px; perspective: 1400px; }
  .grid { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(7, 150px); gap: 18px; justify-content: center; align-content: center;
    transform: rotateX(28deg) rotateY(-24deg) rotateZ(14deg); transform-style: preserve-3d; }
  .grid .card { width: 150px; box-shadow: 0 18px 30px rgba(0, 0, 0, 0.6); }
  .grid .card .foil { display: none; }
  .grid .hot { box-shadow: 0 0 0 3px #ffd277, 0 0 46px rgba(255, 196, 92, 0.7); }
  .fade { position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background:
      linear-gradient(90deg, #0a1216 0%, #0a1216 34%, rgba(10, 18, 22, 0.85) 52%, rgba(10, 18, 22, 0.2) 72%, rgba(10, 18, 22, 0.05) 100%),
      linear-gradient(0deg, rgba(10, 18, 22, 0.9), transparent 30%, transparent 75%, rgba(10, 18, 22, 0.7)); }
  .glow { position: absolute; z-index: 1; left: -200px; top: -120px; width: 900px; height: 700px; background: radial-gradient(closest-side, rgba(169, 199, 211, 0.2), transparent); }
  .scan { position: absolute; inset: 0; z-index: 1; background: repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.025) 0 1px, transparent 1px 4px); }
  .copy { position: absolute; z-index: 2; left: 84px; top: 64px; width: 900px; }
  .kick { display: inline-flex; align-items: center; gap: 10px; padding: 8px 16px 8px 12px; border-radius: 999px; background: rgba(169, 199, 211, 0.12); border: 1px solid rgba(169, 199, 211, 0.5); color: #a9c7d3; font: 800 15px/1 Inter, sans-serif; letter-spacing: 0.16em; }
  .kick i { width: 10px; height: 10px; border-radius: 50%; background: #a9c7d3; box-shadow: 0 0 0 5px rgba(169, 199, 211, 0.2), 0 0 14px #a9c7d3; }
  h1 { margin: 22px 0 0; font: 700 80px/0.95 'Space Grotesk', sans-serif; letter-spacing: -0.045em; color: #fff; }
  h1 span { display: block; background: linear-gradient(90deg, #a9c7d3, #e8f4f8 45%, #ffd277); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { margin-top: 22px; display: flex; align-items: center; gap: 14px; font: 700 21px/1 Inter, sans-serif; color: rgba(255, 255, 255, 0.78); }
  .sub b { color: #fff; }
  .sub .sep { width: 6px; height: 6px; border-radius: 50%; background: rgba(255, 255, 255, 0.35); }
  .brand { position: absolute; z-index: 2; right: 46px; bottom: 34px; display: flex; align-items: center; gap: 14px; padding: 12px 20px 12px 12px; border-radius: 16px; background: rgba(10, 18, 22, 0.78); border: 1px solid rgba(255, 255, 255, 0.14); backdrop-filter: blur(8px); }
  .brand img { width: 44px; height: 44px; }
  .brand span { font: 700 28px/1 'Space Grotesk', sans-serif; color: #fff; letter-spacing: -0.03em; }
  .brand span b { color: #a9c7d3; margin-left: 0.2em; }
  .brand em { font: 700 17px/1 'JetBrains Mono', monospace; font-style: normal; color: rgba(255, 255, 255, 0.7); padding-left: 14px; border-left: 1px solid rgba(255, 255, 255, 0.2); }
</style>
</head>
<body>
<div class="hdr" id="hdr">
  <div class="wall"><div class="grid" id="grid"></div></div>
  <div class="glow"></div><div class="fade"></div><div class="scan"></div>
  <div class="copy">
    <div class="kick"><i></i>POKÉMON PACKS ON SOLANA</div>
    <h1>Open real Pokémon<span>packs on-chain.</span></h1>
    <div class="sub"><span>Packs from <b>$10</b></span><span class="sep"></span><span>Paid in <b>SOL</b></span><span class="sep"></span><span>Hits up to <b>$320</b></span><span class="sep"></span><span>On <b>StonkFun</b></span></div>
  </div>
  <div class="brand"><img src="stonkpacks-icon.svg" alt=""><span>Stonk<b>Packs</b></span><em>stonkpacks.store</em></div>
</div>
<script>window.PN_CONFIG = { remoteImages: false };</script>
<script src="../../js/cards.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/sha256.js"></script>
<script src="../../js/data.js"></script>
<script src="../../js/engine.js"></script>
<script src="../../js/store.js"></script>
<script src="../../js/wallets.js"></script>
<script src="../../js/app.js"></script>
<script>
  // Every pack's best cards, the chase cards highlighted.
  var fix = function (h) { return h.replace(/src="assets\//g, 'src="../../assets/'); };
  var hits = [];
  PN.data.PACKS.forEach(function (p) { p.top.slice(0, 7).forEach(function (c) { hits.push(c); }); });
  var order = [9, 0, 14, 21, 7, 2, 15, 22, 1, 8, 23, 3, 16, 10, 24, 4, 17, 11, 25, 5, 18, 12, 26, 6, 19, 13, 27, 20];
  var hot = { 'mew-199': 1, 'blk-171': 1, 'meg-188': 1, 'blk-172': 1 };
  document.getElementById('grid').innerHTML = order.concat(order).slice(0, 35).map(function (i) {
    var c = hits[i % hits.length];
    return fix(PN.ui.cardHTML(c)).replace('class="card ', 'class="card ' + (hot[c.id] ? 'hot ' : ''));
  }).join('');
  Promise.all(Array.from(document.images).map(function (im) { return im.decode().catch(function () {}); })).then(function () { document.body.setAttribute('data-ready', '1'); });
</script>
</body>
</html>
