<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Near Packs X post</title>
<!-- Source for x-post.png (1600x900, 16:9 so X shows it uncropped). Render with: npm run build:x-post -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@700&family=Space+Grotesk:wght@600;700&display=swap">
<link rel="stylesheet" href="../../css/style.css">
<style>
  html, body { margin: 0; background: #070a1c; }
  .post { position: relative; width: 1600px; height: 900px; overflow: hidden;
    background:
      radial-gradient(600px 420px at 74% 52%, rgba(0, 236, 151, 0.22), transparent 70%),
      radial-gradient(900px 600px at 70% 45%, rgba(139, 123, 255, 0.30), transparent 70%),
      linear-gradient(160deg, #13171c, #070809 70%);
  }
  .rays { position: absolute; inset: -40%; left: 10%; background: repeating-conic-gradient(from 0deg at 64% 50%, rgba(255, 255, 255, 0.045) 0 4deg, transparent 4deg 12deg); }
  .dots { position: absolute; inset: 0; background: radial-gradient(rgba(255, 255, 255, 0.09) 1px, transparent 1.3px) 0 0 / 24px 24px; -webkit-mask-image: linear-gradient(90deg, #000, transparent 60%); mask-image: linear-gradient(90deg, #000, transparent 60%); }
  .copy { position: absolute; left: 90px; top: 0; bottom: 0; width: 720px; display: flex; flex-direction: column; justify-content: center; gap: 30px; z-index: 3; }
  .copy .logo { width: 520px; margin-left: -10px; filter: drop-shadow(0 12px 20px rgba(0, 0, 0, 0.5)); }
  h1 { margin: 0; font: 700 72px/1.02 'Space Grotesk', sans-serif; color: #fff; letter-spacing: -0.035em; }
  h1 em { font-style: normal; color: #00ec97; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
  li { display: flex; align-items: center; gap: 14px; font: 800 27px/1.2 Inter, sans-serif; color: #eef0ff; }
  li i { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: #00ec97; color: #00170e; font: 900 19px/1 Inter, sans-serif; font-style: normal; }
  .socials { display: flex; gap: 12px; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 10px; padding: 11px 20px; border-radius: 999px; background: rgba(10, 14, 40, 0.8); border: 1px solid rgba(255, 255, 255, 0.2); font: 800 22px/1 Inter, sans-serif; color: #fff; }
  .chip b { color: #00ec97; font-family: 'JetBrains Mono', monospace; }
  .chip .chain-dot { width: 22px; height: 22px; margin: 0; }
  .showcase { position: absolute; right: 40px; top: 0; bottom: 0; width: 760px; } /* no z-index: a stacking context here would isolate the packs color-dodge foil and wash it out */
  .pack { position: absolute; width: 230px; }
  .pack .booster { filter: drop-shadow(0 26px 30px rgba(0, 0, 0, 0.6)); }
  .pack .bw-sheen { display: none; } /* the moving sheen would freeze mid-sweep in a still image */
  .pk1 { left: 40px; top: 110px; transform: rotate(-12deg); }
  .pk2 { right: 40px; top: 110px; transform: rotate(12deg); }
  /* Same fan as the site's landing page, scaled up. */
  .hand { position: absolute; left: 50%; top: 54%; width: 460px; transform: translate(-50%, -50%) scale(1.32); }
  .badge { position: absolute; right: 70px; bottom: 70px; z-index: 4; transform: rotate(-6deg); padding: 16px 26px; border-radius: 18px; background: linear-gradient(135deg, #00ec97, #7b6bff); color: #00170e; font: 400 36px/1 'Space Grotesk', sans-serif; box-shadow: 0 14px 26px rgba(0, 0, 0, 0.5), inset 0 -4px 0 rgba(0, 0, 0, 0.2); }
  .badge small { display: block; font: 800 16px/1.3 Inter, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.9; }
  .np-word { display: flex; align-items: center; gap: 0.32em; font: 700 1em/1 'Space Grotesk', sans-serif; letter-spacing: -0.035em; color: #fff; }
  .np-word img { width: 1.15em; height: 1.15em; border-radius: 0; filter: drop-shadow(0 0.08em 0.25em rgba(0, 236, 151, 0.45)); }
  .np-word b { color: #00ec97; font-weight: 700; margin-left: 0.18em; }
</style>
</head>
<body>
<div class="post" id="post">
  <div class="rays"></div><div class="dots"></div>
  <div class="copy">
    <div style="font-size:88px"><div class="np-word"><img src="nearpacks-icon.svg" alt=""><span>Near<b>Packs</b></span></div></div>
    <h1>Open real Pokémon packs <em>with NEAR</em></h1>
    <ul>
      <li><i>1</i>Packs from $10, paid in NEAR</li>
      <li><i>2</i>Exact odds for every card</li>
      <li><i>3</i>On-chain randomness you can verify</li>
      <li><i>4</i>Sell any pull back for 96%</li>
    </ul>
    <div class="socials">
      <span class="chip"><span class="chain-dot near"></span>NEAR</span>
      <span class="chip"><b>@NearPacks</b></span>
      <span class="chip">nearpacks.fun</span>
    </div>
  </div>
  <div class="showcase">
    <div class="pack pk1" data-pack="elite"></div>
    <div class="pack pk2" data-pack="legend"></div>
    <div class="hand"><div class="fan" id="cards"></div></div>
  </div>
  <div class="badge"><small>Near Packs</small>Live on NEAR</div>
</div>
<script>window.PN_CONFIG = { remoteImages: false };</script>
<script src="../../js/cards.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/sha256.js"></script>
<script src="../../js/data.js"></script>
<script src="../../js/engine.js"></script>
<script src="../../js/store.js"></script>
<script src="../../js/wallets.js"></script>
<script src="../../js/app.js"></script>
<script>
  // Asset paths in app.js are relative to the site root.
  var fix = function (h) { return h.replace(/src="assets\//g, 'src="../../assets/'); };
  document.querySelectorAll('[data-pack]').forEach(function (el) {
    el.innerHTML = fix(PN.ui.packArtHTML(PN.data.packById[el.getAttribute('data-pack')]));
  });
  document.getElementById('cards').innerHTML = ['meg-188', 'mew-199', 'blk-171'].map(function (id) { return fix(PN.ui.cardHTML(PN.data.cardById[id])); }).join('');
  // ?first: launch-day version (first post with the CA): the token is live, not "coming soon".
  if (/[?&]first\b/.test(location.search)) document.querySelector('.badge').innerHTML = '<small>Near Packs</small>Live on NEAR';
  document.body.setAttribute('data-ready', '1');
</script>
</body>
</html>
