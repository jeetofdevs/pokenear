<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Near Packs X post</title>
<!-- Source for x-post.png / x-first-post.png (1600x900, 16:9 so X shows it uncropped).
     Render with: npm run build:x-post. No contract address on the image. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=JetBrains+Mono:wght@700&family=Space+Grotesk:wght@600;700&display=swap">
<link rel="stylesheet" href="../../css/style.css">
<style>
  html, body { margin: 0; background: #0a1216; }
  .post { position: relative; width: 1600px; height: 900px; overflow: hidden; background: #0a1216; }
  /* light bursting out of the pack */
  .burst { position: absolute; left: 1150px; top: 330px; width: 2200px; height: 2200px; transform: translate(-50%, -50%);
    background: repeating-conic-gradient(from 0deg, rgba(255, 214, 120, 0.16) 0 3deg, transparent 3deg 11deg);
    -webkit-mask-image: radial-gradient(closest-side, #000 8%, transparent 62%); mask-image: radial-gradient(closest-side, #000 8%, transparent 62%); }
  .halo { position: absolute; left: 1150px; top: 360px; width: 1100px; height: 900px; transform: translate(-50%, -50%);
    background: radial-gradient(closest-side, rgba(255, 196, 92, 0.55), rgba(245, 120, 40, 0.18) 45%, transparent 70%); }
  .floor { position: absolute; left: 0; right: 0; bottom: 0; height: 300px; background: linear-gradient(0deg, #0a1216 20%, transparent); z-index: 3; }
  .grain { position: absolute; inset: 0; z-index: 6; pointer-events: none; opacity: 0.35; background: radial-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1.2px) 0 0 / 5px 5px; }

  /* the pack, torn open at the top */
  .pack { position: absolute; z-index: 2; left: 1150px; top: 520px; width: 330px; transform: translate(-50%, 0) rotate(-4deg); }
  .pack .bw-sheen { display: none; }
  .pack .booster { filter: drop-shadow(0 40px 50px rgba(0, 0, 0, 0.8)); }
  .pack .bw { -webkit-mask-image: linear-gradient(176deg, transparent 9%, #000 9.5%); mask-image: linear-gradient(176deg, transparent 9%, #000 9.5%); }
  .flap { position: absolute; z-index: 1; left: 1300px; top: 418px; width: 340px; height: 62px; transform: rotate(-22deg); border-radius: 6px 6px 2px 2px;
    background: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.35) 0 4px, rgba(0, 0, 0, 0.25) 4px 8px), linear-gradient(180deg, #fff0b8, #f5b942 60%, #8a5200);
    box-shadow: 0 16px 30px rgba(0, 0, 0, 0.6); }

  /* the hit rising out of it */
  .hit { position: absolute; z-index: 4; left: 1150px; top: 70px; width: 330px; transform: translateX(-50%) rotate(5deg); }
  .hit .card { width: 330px; box-shadow: 0 0 0 4px rgba(255, 226, 150, 0.95), 0 0 70px rgba(255, 190, 80, 0.85), 0 40px 60px rgba(0, 0, 0, 0.7); }
  .hit .foil { display: none; }
  .tag { position: absolute; z-index: 5; left: 1328px; top: 92px; transform: rotate(9deg); padding: 14px 22px; border-radius: 16px; background: #0b0d10; border: 2px solid #ffd277;
    font: 700 54px/1 'Space Grotesk', sans-serif; color: #ffd277; letter-spacing: -0.03em; box-shadow: 0 18px 36px rgba(0, 0, 0, 0.6), 0 0 30px rgba(255, 196, 92, 0.4); }
  .tag small { display: block; font: 800 14px/1.2 Inter, sans-serif; letter-spacing: 0.16em; color: rgba(255, 255, 255, 0.7); margin-bottom: 6px; }

  /* other pulls flying around */
  .fly { position: absolute; z-index: 1; width: 170px; opacity: 0.9; filter: blur(0.4px) drop-shadow(0 20px 26px rgba(0, 0, 0, 0.7)); }
  .fly .card { width: 170px; }
  .fly .foil { display: none; }
  .f1 { left: 790px; top: 150px; transform: rotate(-24deg); }
  .f2 { left: 1400px; top: 300px; transform: rotate(18deg); }
  .f3 { left: 820px; top: 470px; transform: rotate(-12deg) scale(0.85); opacity: 0.75; }

  /* copy */
  .copy { position: absolute; z-index: 5; left: 90px; top: 92px; width: 720px; }
  .logo { display: flex; align-items: center; gap: 16px; font: 700 40px/1 'Space Grotesk', sans-serif; color: #fff; letter-spacing: -0.03em; }
  .logo img { width: 58px; height: 58px; }
  .logo b { color: #a9c7d3; margin-left: 0.2em; }
  .live { display: inline-flex; align-items: center; gap: 10px; margin-left: 10px; padding: 8px 14px; border-radius: 999px; background: #a9c7d3; color: #0a1216; font: 900 14px/1 Inter, sans-serif; letter-spacing: 0.14em; }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: #0a1216; }
  h1 { margin: 64px 0 0; font: 700 96px/0.95 'Space Grotesk', sans-serif; letter-spacing: -0.05em; color: #fff; }
  h1 .gold { background: linear-gradient(90deg, #ffe7a3, #ffb84a 60%, #ff8a3d); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .lede { margin: 30px 0 0; font: 600 27px/1.4 Inter, sans-serif; color: rgba(255, 255, 255, 0.75); max-width: 640px; }
  .lede b { color: #fff; }
  .stats { position: absolute; z-index: 5; left: 90px; bottom: 84px; display: flex; gap: 14px; }
  .stat { padding: 18px 22px; min-width: 150px; border-radius: 18px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.12); }
  .stat b { display: block; font: 700 38px/1 'Space Grotesk', sans-serif; color: #fff; letter-spacing: -0.03em; }
  .stat span { display: block; margin-top: 8px; font: 700 15px/1 Inter, sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255, 255, 255, 0.55); }
  .stat.g b { color: #a9c7d3; }
  .url { position: absolute; z-index: 5; right: 70px; bottom: 84px; display: flex; align-items: center; gap: 14px; padding: 18px 26px; border-radius: 18px; background: #a9c7d3; color: #0a1216;
    font: 700 34px/1 'Space Grotesk', sans-serif; letter-spacing: -0.02em; box-shadow: 0 18px 40px rgba(169, 199, 211, 0.35); }
  .url svg { width: 30px; height: 30px; }
</style>
</head>
<body>
<div class="post" id="post">
  <div class="halo"></div><div class="burst"></div>
  <div class="fly f1" id="f1"></div><div class="fly f2" id="f2"></div><div class="fly f3" id="f3"></div>
  <div class="pack" data-pack="legend"></div>
  <div class="hit" id="hit"></div>
  <div class="tag"><small>LEGEND PACK HIT</small>$320</div>
  <div class="floor"></div>
  <div class="copy">
    <div class="logo"><img src="stonkpacks-icon.svg" alt=""><span>Stonk<b>Packs</b></span><span class="live"><i></i>SOLANA</span></div>
    <h1>One pack.<br>One card.<br><span class="gold">Could be $320.</span></h1>
    <p class="lede">Real Pokémon cards. Packs from <b>$10</b>, paid in <b>SOL</b>. Every pull drawn on-chain.</p>
  </div>
  <div class="stats">
    <div class="stat g"><b>98%</b><span>Avg value</span></div>
    <div class="stat"><b>$10</b><span>Packs from</span></div>
    <div class="stat"><b>SOL</b><span>www.stonkfun.xyz</span></div>
    <div class="stat"><b>100%</b><span>On-chain RNG</span></div>
  </div>
  <div class="url">stonkpacks.store<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
  <div class="grain"></div>
</div>
<script>window.PN_CONFIG = { remoteImages: false };</script>
<script src="../../js/cards.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/sha256.js"></script>
<script src="../../js/data.js"></script>
<script src="../../js/engine.js"></script>
<script src="../../js/store.js"></script>
<script src="../../js/wallets.js"></script>
<script src="../../js/app.js"></script>
<script>
  var fix = function (h) { return h.replace(/src="assets\//g, 'src="../../assets/'); };
  var card = function (id) { return fix(PN.ui.cardHTML(PN.data.cardById[id])); };
  document.querySelectorAll('[data-pack]').forEach(function (el) { el.innerHTML = fix(PN.ui.packArtHTML(PN.data.packById[el.getAttribute('data-pack')])); });
  document.getElementById('hit').innerHTML = card('mew-199');   // Charizard ex, $320
  document.getElementById('f1').innerHTML = card('blk-171');    // Victini
  document.getElementById('f2').innerHTML = card('meg-188');    // Mega Lucario ex
  document.getElementById('f3').innerHTML = card('blk-172');    // Zekrom ex
  Promise.all(Array.from(document.images).map(function (im) { return im.decode().catch(function () {}); })).then(function () { document.body.setAttribute('data-ready', '1'); });
</script>
</body>
</html>
