[package]
name = "pokenear-rng"
version = "0.1.0"
edition = "2021"
description = "Pokenear on-chain randomness for card rips on NEAR"
publish = false
rust-version = "1.81"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.11.0"

[dev-dependencies]
near-sdk = { version = "=5.11.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
